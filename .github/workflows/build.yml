name: build (macOS x86_64)

# Builds the de-branded CrossOver-performance Wine fork as an x86_64 macOS binary
# (the CrossOver target: x86_64 Wine run under Rosetta 2 on Apple Silicon).
# Uses the native-x86_64 `macos-15-intel` runner so clang defaults to x86_64 and
# Homebrew (/usr/local) provides x86_64 FreeType / MoltenVK — no -arch juggling.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only keep the latest run per branch; cancel superseded in-progress runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: configure + make (x86_64)
    runs-on: macos-15-intel
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew update
          # bison >= 3.0 (system is 2.3), flex, mingw for the PE DLLs,
          # MoltenVK + Vulkan loader for the wined3d Metal path, freetype for fonts.
          brew install bison flex mingw-w64 molten-vk vulkan-loader freetype pkg-config ccache

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ runner.os }}-x86_64-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-x86_64-

      - name: configure
        run: |
          set -euxo pipefail
          BP="$(brew --prefix)"
          export PATH="$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$BP/bin:$PATH"
          export PKG_CONFIG_PATH="$(brew --prefix molten-vk)/lib/pkgconfig:$(brew --prefix vulkan-loader)/lib/pkgconfig:$BP/lib/pkgconfig"
          export CPPFLAGS="-I$BP/include"
          export LDFLAGS="-L$BP/lib"
          ./configure \
            --enable-win64 \
            --without-x \
            --disable-tests \
            CC="ccache clang" CXX="ccache clang++"

      - name: make
        run: |
          set -euxo pipefail
          export PATH="$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$(brew --prefix)/bin:$PATH"
          make -j"$(sysctl -n hw.ncpu)"

      - name: Verify ported features landed in binaries
        run: |
          set -euxo pipefail
          echo "== msync (ntdll client + wineserver) =="
          nm dlls/ntdll/ntdll.so  | grep -E '_(do_msync|msync_init)$'
          nm server/wineserver     | grep -E '_(create_msync|msync_init_shm)$'
          echo "== D3DMetal + BC7 (winemac driver) =="
          nm dlls/winemac.drv/winemac.so | grep -E '_(macdrv_functions|macdrv_client_surface_present)$'
          echo "== wined3d Vulkan/Metal PE dll =="
          test -f dlls/wined3d/x86_64-windows/wined3d.dll
          echo "ALL PORTED FEATURES PRESENT"

      - name: Package build output
        run: |
          set -euxo pipefail
          mkdir -p dist
          # Key unix-side binaries + the PE DLLs that carry the ported features.
          cp loader/wine server/wineserver dist/ 2>/dev/null || true
          for so in dlls/ntdll/ntdll.so dlls/win32u/win32u.so dlls/winemac.drv/winemac.so; do
            [ -f "$so" ] && cp "$so" dist/
          done
          mkdir -p dist/pe
          for dll in dlls/wined3d/x86_64-windows/wined3d.dll \
                     dlls/win32u/x86_64-windows/win32u.dll \
                     dlls/wow64/x86_64-windows/wow64.dll \
                     dlls/wow64cpu/x86_64-windows/wow64cpu.dll; do
            [ -f "$dll" ] && cp "$dll" dist/pe/
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wine-x86_64-macos
          path: dist/
          if-no-files-found: warn
          retention-days: 14
